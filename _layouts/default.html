<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{ site.description }}">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<style>
  :root { --bg: #fbfaf7; --ink: #1d1c1a; --ink2: #55524c; --line: #dcd8cf; --link: #1f4f8a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141412; --ink: #ecebe6; --ink2: #b4b1a8; --line: #3a3833; --link: #8db8ee; } }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; } header a { color: var(--ink); font-weight: 600; text-decoration: none; }
  main { padding-bottom: 32px; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 1.2rem 0 .8rem; }
  h2 { font-size: 1.3rem; margin: 2rem 0 .6rem; padding-top: .4rem; border-top: 1px solid var(--line); }
  a { color: var(--link); } a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 1rem 0; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--line) 35%, transparent); }
  footer { color: var(--ink2); font-size: .9rem; padding-bottom: 32px; border-top: 1px solid var(--line); padding-top: 12px; }
  footer a { color: var(--ink2); }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
<main>
{{ content | replace: '<table>', '<div class="table-wrap"><table>' | replace: '</table>', '</table></div>' }}
</main>
<footer>
<a href="{{ '/privacy' | relative_url }}">Privacy Policy</a> · <a href="{{ '/terms' | relative_url }}">Terms of Use</a> · <a href="{{ '/support' | relative_url }}">Support</a> · <a href="{{ '/methodology' | relative_url }}">How ratings work</a> · <a href="mailto:jfdevios@gmail.com">jfdevios@gmail.com</a>
</footer>
</body>
</html>
